apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
def env = new Properties()
def envFile = rootProject.file("../.env")

if (envFile.exists()) {
    env.load(new FileInputStream(envFile))
}
android {
    signingConfigs {
    }
    defaultConfig {
        compileSdk 34
        minSdkVersion 24
        multiDexEnabled true
        targetSdkVersion 34

        def host = env.getProperty("HOST", "127.0.0.1")
        def port = env.getProperty("PORT", "8080")
        println(">>> ENV DEBUG: HOST=${host}, PORT=${port}")
        buildConfigField "String", "HOST", "\"${host}\""
        buildConfigField "int", "PORT", port
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }
    namespace 'com.radaee.pdfmaster'
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    api project(':ViewLib')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core-ktx:1.13.1'
}
